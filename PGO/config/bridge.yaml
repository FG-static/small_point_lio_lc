small_point_lio_keyframe_bridge:
  ros__parameters:
    odom_topic: "/Odometry"
    cloud_topic: "/cloud_registered"
    # Every synchronized frontend frame is a candidate. The backend applies
    # the actual keyframe gate and republishes accepted frames on /keyframe_msg.
    keyframe_topic: "/keyframe_candidates"
    odom_frame: "odom"
    body_frame: "base_link"
    max_cloud_delay_sec: 0.05
    odom_buffer_duration_sec: 1.0
    min_cloud_points: 10
